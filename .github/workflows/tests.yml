name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dataeng
          POSTGRES_USER: dataeng
          POSTGRES_PASSWORD: dataeng
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataeng -d dataeng"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary python-dotenv

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: dataeng
          DB_USER: dataeng
          DB_PASSWORD: dataeng
        run: pytest